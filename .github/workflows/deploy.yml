name: deploy

# Puts a built image on the server. Staging and production differ only in which
# Infisical environment the secrets come from and whether the container is
# restarted automatically, so they share this one definition rather than a
# copy each.
#
# Secrets never reach the image or the agent. The container starts under core's
# own entrypoint, which brings up the credential proxy while the keys are still
# in the environment, scrubs them, and drops privileges. The plugin reaches its
# upstreams through that proxy.

on:
  workflow_call:
    inputs:
      image:
        description: 'Image to pull and run'
        required: true
        type: string
      target:
        description: "Which deployment this is, for the log: staging or production"
        required: true
        type: string
      env_slug:
        description: "Infisical environment to read secrets from: staging or prod"
        required: true
        type: string
      restart:
        description: 'Restart the container automatically if it exits'
        required: false
        default: false
        type: boolean
    secrets:
      # Passed in by name rather than inherited, because staging and production
      # authenticate to Infisical as different machine identities and so keep
      # their credentials under different names.
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true
      INFISICAL_PROJECT_SLUG:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ inputs.env_slug }}

      - name: Deploy to ${{ inputs.target }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,RESTART,GHCR_USER,GHCR_TOKEN,ASI_API_KEY,OPENAI_API_KEY,ANTHROPIC_API_KEY,OPENROUTER_API_KEY,TG_BOT_TOKEN,TG_CHAT_ID,LLM_PROVIDER,LLM_MODEL
          script: |
            set -e
            mkdir -p /omega

            # A breadcrumb, not the credentials: enough of each key to tell
            # which one is in use, and nothing an attacker could spend. The
            # real values arrive through -e below, which overrides --env-file.
            tee /omega/.env > /dev/null <<EOF
            ASI_API_KEY=...${ASI_API_KEY: -5}
            OPENAI_API_KEY=...${OPENAI_API_KEY: -5}
            ANTHROPIC_API_KEY=...${ANTHROPIC_API_KEY: -5}
            OPENROUTER_API_KEY=...${OPENROUTER_API_KEY: -5}
            TG_BOT_TOKEN=...${TG_BOT_TOKEN: -5}
            TG_CHAT_ID=${TG_CHAT_ID}
            LLM_PROVIDER=${LLM_PROVIDER}
            LLM_MODEL=${LLM_MODEL}
            EOF
            chmod 600 /omega/.env

            mkdir -p /Backup/docker/PeTTa

            # The package is private, so the pull needs a login even here.
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker pull "${IMAGE}"
            docker rm -f omega 2>/dev/null || true

            # The prompt ships inside the plugin at plugins/telegram/prompt.txt
            # and is read from there, so it is not copied out of the image and
            # mounted back. To override it, mount a file and point
            # TG_PROMPT_PATH at it.
            docker run -d \
              --name omega \
              ${RESTART:+--restart=always} \
              --env-file /omega/.env \
              -e ASI_API_KEY="${ASI_API_KEY}" \
              -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
              -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
              -e OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
              -e TG_BOT_TOKEN="${TG_BOT_TOKEN}" \
              -v /Backup/docker/PeTTa:/PeTTa/repos/Omega/memory \
              "${IMAGE}" \
              commchannel=telegram \
              TG_CHAT_ID=${TG_CHAT_ID} \
              provider=${LLM_PROVIDER} \
              ${LLM_MODEL:+LLM=${LLM_MODEL}} \
              embeddingprovider=OpenAI
        env:
          IMAGE: ${{ inputs.image }}
          RESTART: ${{ inputs.restart && '1' || '' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASI_API_KEY: ${{ env.ASI_API_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          TG_BOT_TOKEN: ${{ env.BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.CHAT_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'OpenRouter' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
